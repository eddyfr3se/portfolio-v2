<section class="references" id="references">
  <h2 class="references__title">Need a teamplayer?</h2>
  <p class="references__subtitle">Here is what my colleagues say about me.</p>

  <div class="references__list">
    @for (item of testimonials; track item.name) {
      <article class="card" [class.is-active]="$index === current">
        <p class="card__name">{{ item.name }}</p>
        <p class="card__project">{{ item.project }}</p>
        <p class="card__quote">{{ item.quote }}</p>
      </article>
    }
  </div>

  <!-- Pfeile nur auf Mobile, blättern durch die Zitate -->
  <div class="references__arrows">
    <button (click)="prev()" aria-label="Vorheriges Zitat">‹</button>
    <button (click)="next()" aria-label="Nächstes Zitat">›</button>
  </div>
</section>
