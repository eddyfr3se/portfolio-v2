<section class="contact" id="contact">
  <h2 class="contact__title">Contact</h2>

  <div class="contact__body">
    <div class="contact__intro">
      <h3 class="contact__heading">Got a problem to solve?</h3>
      <!-- Platzhalter, echten Text liefert noch der Nutzer (DE/EN) -->
      <p class="contact__text">
        Encourage people to contact you and describe what role you are interested in.
        Show that you will add value to their projects through your work.
      </p>
      <p class="contact__cta">
        Need a Frontend developer? <strong>Contact me!</strong>
      </p>
    </div>

    <!-- noch ein einfaches Formular, die Logik (Reactive Forms) kommt Tag 10 -->
    <form class="contact__form">
      <input class="contact__field" type="text" placeholder="Your name" />
      <input class="contact__field" type="email" placeholder="Your email" />
      <textarea class="contact__field contact__message" placeholder="Your message"></textarea>

      <label class="contact__privacy">
        <input type="checkbox" />
        <span>
          I've read the <a href="#">privacy policy</a> and agree to the processing of my
          data as outlined.
        </span>
      </label>

      <button class="contact__send" type="submit">Say hello ;)</button>
    </form>
  </div>
</section>
