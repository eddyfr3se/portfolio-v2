<section class="hero" id="home">
  <!-- großer blauer Kreis hinter dem Foto -->
  <div class="hero__circle"></div>

  <img
    class="hero__photo"
    src="assets/img/profilbild-cutout.png"
    alt="Profilfoto"
    fetchpriority="high"
  />

  <div class="hero__text">
    <p class="greeting">{{ 'hero.greeting' | translate }}</p>
    <h1 class="job-title">
      <span class="line1">FRONTEND</span>
      <span class="line2">DEVELOPER</span>
    </h1>
  </div>

  <div class="hero__scroll">
    <span class="hero__scroll-word">SCROLL</span>
    <span class="hero__scroll-phrase">{{ 'hero.scroll' | translate }}</span>
    <span class="line"></span>
  </div>

  <div class="hero__social">
    <a href="https://github.com/eddyfr3se" target="_blank" rel="noopener" aria-label="GitHub">
      <img src="assets/icons/icon-github.svg" alt="" />
    </a>
    <a href="mailto:krawall-kreativ.de@outlook.de" aria-label="E-Mail">
      <img src="assets/icons/icon-email.svg" alt="" />
    </a>
    <a href="#" aria-label="LinkedIn"><img src="assets/icons/icon-linkedin.svg" alt="" /></a>
  </div>
</section>
