<footer class="footer">
  <div class="footer__bar">
    <a routerLink="/" class="footer__logo" aria-label="Startseite"></a>
    <p class="footer__copy">© Christopher Rauch {{ year }}</p>
    <div class="footer__social">
      <a href="https://github.com/eddyfr3se" target="_blank" rel="noopener" aria-label="GitHub">
        <img src="assets/icons/github-button.svg" alt="" />
      </a>
      <a href="mailto:krawall-kreativ.de@outlook.de" aria-label="E-Mail">
        <img src="assets/icons/mail-button.svg" alt="" />
      </a>
      <a href="https://www.linkedin.com/in/chris-rauch-993a06417" target="_blank" rel="noopener" aria-label="LinkedIn">
        <img src="assets/icons/linkedin-button.svg" alt="" />
      </a>
    </div>
  </div>

  <a routerLink="/legal-notice" class="footer__legal">Legal Notice</a>
  <button
    class="footer__top"
    [class.footer__top--visible]="showTop"
    (click)="scrollTop()"
    aria-label="Nach oben"
  >↑</button>
</footer>
