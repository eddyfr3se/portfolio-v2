<article class="card" [class.card--reverse]="reverse()">
  <img
    class="card__img"
    [src]="project().image"
    [alt]="project().name"
    loading="lazy"
  />

  <div class="card__text">
    <h3 class="card__name">{{ project().name }}</h3>
    <p class="card__stack">{{ project().stack }}</p>
    <p class="card__desc">{{ project().description | translate }}</p>
    <div class="card__links">
      @if (project().liveUrl) {
        <a class="card__btn" [href]="project().liveUrl" target="_blank" rel="noopener noreferrer">Live</a>
      }
      <a class="card__btn" [href]="project().githubUrl" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </div>
</article>
