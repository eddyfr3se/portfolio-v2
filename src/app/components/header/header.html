<header class="header" [class.menu-open]="menuOpen" [class.header--inner]="!isHome">
  <a routerLink="/" class="logo" (click)="closeMenu()" aria-label="Startseite"></a>
  <button
    class="burger"
    [class.open]="menuOpen"
    (click)="toggleMenu()"
    [attr.aria-label]="menuOpen ? 'Menü schließen' : 'Menü öffnen'"
  >
    <img src="assets/icons/burger-menu.svg" alt="" />
  </button>

  <div class="menu" [class.open]="menuOpen">
    <nav class="nav">
      <a routerLink="/" fragment="about" (click)="closeMenu()">{{ 'nav.about' | translate }}</a>
      <a routerLink="/" fragment="skills" (click)="closeMenu()">{{ 'nav.skills' | translate }}</a>
      <a routerLink="/" fragment="work" (click)="closeMenu()">{{ 'nav.work' | translate }}</a>
      <a routerLink="/" fragment="contact" (click)="closeMenu()">{{ 'nav.contact' | translate }}</a>
    </nav>

    <div class="lang">
      <button [class.active]="lang === 'de'" (click)="setLang('de')">DE</button>
      <span class="sep">/</span>
      <button [class.active]="lang === 'en'" (click)="setLang('en')">EN</button>
    </div>
  </div>
</header>
