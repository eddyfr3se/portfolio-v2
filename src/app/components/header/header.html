<header class="header" [class.menu-open]="menuOpen" [class.header--inner]="!isHome">
  <a routerLink="/" class="logo" (click)="closeMenu()" aria-label="Startseite"></a>

  <button
    class="burger"
    [class.open]="menuOpen"
    (click)="toggleMenu()"
    aria-label="Menü öffnen"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="menu" [class.open]="menuOpen">
    <nav class="nav">
      <a href="#about" (click)="closeMenu()">About me</a>
      <a href="#skills" (click)="closeMenu()">Skill set</a>
      <a href="#work" (click)="closeMenu()">My work</a>
      <a href="#contact" (click)="closeMenu()">Contact</a>
    </nav>

    <!-- Sprachschalter ist erstmal nur Optik (Logik an Tag 12) -->
    <div class="lang">
      <button [class.active]="lang === 'DE'" (click)="setLang('DE')">DE</button>
      <span class="sep">/</span>
      <button [class.active]="lang === 'EN'" (click)="setLang('EN')">EN</button>
    </div>
  </div>
</header>
